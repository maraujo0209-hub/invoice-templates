<title>Goal Tracker — [Your Company Name]</title>
<style>
  :root{
    --bg:#FFFFFF; --surface:#FBFBFB; --primary:#222222; --primary-dark:#000000;
    --accent:#8C8C8C; --text:#1C1C1C; --muted:#767676; --border:#E5E5E5; --chip:#F2F2F2; --danger:#B3261E;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Helvetica Neue', Arial, sans-serif;font-size:14px;line-height:1.55;}
  .page{max-width:980px;margin:0 auto;padding:36px 30px 60px;}
  h1,h2,h3{font-family:'Helvetica Neue', Arial, sans-serif;}
  .doc-footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);flex-wrap:wrap;gap:6px;}
  .section{margin-bottom:26px;}
  .section-heading{font-size:15.5px;font-weight:700;color:var(--primary-dark);border-bottom:2px solid var(--accent);padding-bottom:7px;margin-bottom:14px;font-family:'Helvetica Neue', Arial, sans-serif;}
  .section-body{font-size:13.5px;color:var(--text);margin-bottom:6px;}
  table{width:100%;border-collapse:collapse;margin-bottom:8px;}
  thead th{background:var(--primary);color:#fff;text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:9px 10px;}
  thead th.num{text-align:right;}
  tbody td{padding:9px 10px;border-bottom:1px solid var(--border);font-size:13px;}
  tbody tr:nth-child(even){background:var(--chip);}
  td.num{text-align:right;}
  .fill-row td{height:24px;}
  .bullets{margin:0;padding-left:20px;}
  .bullets li{margin-bottom:7px;font-size:13.5px;}
  .bullets.notes{list-style:none;margin:0;padding:0;}
  .bullets.notes li{padding-left:20px;position:relative;}
  .bullets.notes li:before{content:"•";color:var(--accent);font-weight:900;position:absolute;left:0;}
  .checklist{list-style:none;margin:0;padding:0;}
  .checklist li{display:flex;gap:10px;align-items:flex-start;margin-bottom:11px;font-size:13.5px;}
  .checkbox{width:16px;height:16px;border:2px solid var(--primary);border-radius:3px;flex-shrink:0;margin-top:1px;}
  .disclaimer{font-size:12px;font-style:italic;color:var(--danger);background:var(--chip);border-left:3px solid var(--danger);padding:10px 14px;border-radius:0 6px 6px 0;margin-bottom:24px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
  .card-heading{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);margin-bottom:10px;border-bottom:2px solid var(--accent);padding-bottom:6px;display:inline-block;}
  .card-field-label{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
  .card-field-line{border-bottom:1px solid var(--border);min-height:18px;font-size:13.5px;}
  .sign-row{display:flex;gap:24px;margin-bottom:22px;flex-wrap:wrap;}
  .sign-block{flex:1;min-width:200px;}
  .sign-line{border-bottom:2px solid var(--text);height:34px;}
  .sign-label{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:6px;}
  @media print{.page-break{page-break-before:always;} .no-print{display:none;}}
  @media (max-width:640px){.page{padding:20px 14px 40px;} .kpi-grid,.cards-row,.sign-row{flex-direction:column;}}
  </style></head>
