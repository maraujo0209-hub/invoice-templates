<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: A4; margin: 15mm 12mm; }
    body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 10pt; color: #2c3e50; margin: 0; line-height: 1.4; }
    .header { border-bottom: 2px solid #2c3e50; padding-bottom: 10px; margin-bottom: 20px; }
    .header table { width: 100%; }
    .company-title { font-size: 18pt; font-weight: bold; color: #1a252f; text-transform: uppercase; letter-spacing: 1px; }
    .doc-title { font-size: 14pt; font-weight: bold; color: #d35400; text-align: right; text-transform: uppercase; }
    .info-section { width: 100%; margin-bottom: 20px; border-collapse: collapse; }
    .info-section td { padding: 6px 8px; vertical-align: top; }
    .label { font-weight: bold; color: #34495e; width: 22%; background-color: #f8f9fa; border: 1px solid #dee2e6; }
    .value { width: 28%; border: 1px solid #dee2e6; }
    .summary-box { background-color: #fdf2e9; border: 2px solid #d35400; padding: 15px; margin-bottom: 20px; text-align: center; }
    .summary-title { font-size: 11pt; font-weight: bold; color: #d35400; text-transform: uppercase; }
    .summary-value { font-size: 18pt; font-weight: bold; color: #2c3e50; margin-top: 5px; }
  </style>
</head>
<body>
  <div class="header">
    <table><tr><td class="company-title">Apex Analytics</td><td class="doc-title">Break-Even Analysis</td></tr></table>
  </div>
  <table class="info-section">
    <tr><td class="label">Fixed Costs (Monthly):</td><td class="value">$12,000.00</td><td class="label">Average Unit Price:</td><td class="value">$150.00</td></tr>
    <tr><td class="label">Variable Cost / Unit:</td><td class="value">$30.00</td><td class="label">Contribution Margin:</td><td class="value">$120.00 / unit</td></tr>
  </table>
  <div class="summary-box">
    <div class="summary-title">Break-Even Point (Monthly Volume)</div>
    <div class="summary-value">100 Units / $15,000 Revenue</div>
  </div>
</body>
</html>
