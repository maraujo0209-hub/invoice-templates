<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Satisfaction Survey</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --gray-light: #f8fafc;
      --gray-border: #e2e8f0;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family); font-size: 11pt; color: var(--text-dark); background-color: #f1f5f9; padding: 20px; }
    .document-container { max-width: 800px; margin: 0 auto; background: #ffffff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid var(--primary); padding-bottom: 20px; margin-bottom: 24px; }
    .brand { display: flex; gap: 16px; align-items: center; }
    .logo-placeholder { width: 70px; height: 70px; background: var(--gray-light); border: 2px dashed var(--accent); display: flex; align-items: center; justify-content: center; font-size: 9pt; color: var(--text-muted); border-radius: 6px; }
    .doc-title-bar { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; }
    .doc-title { font-size: 22px; color: var(--primary); font-weight: 800; text-transform: uppercase; }
    .section-block { margin-bottom: 20px; }
    .section-block h3 { font-size: 11pt; color: var(--primary); border-bottom: 1px solid var(--gray-border); padding-bottom: 6px; margin-bottom: 10px; }
    .rating-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--gray-light); font-size: 10pt; }
    .options { display: flex; gap: 16px; }
    textarea { width: 100%; height: 80px; padding: 8px; border: 1px solid var(--gray-border); border-radius: 4px; font-family: inherit; font-size: 9.5pt; }
    .footer { margin-top: 40px; border-top: 1px solid var(--gray-border); padding-top: 16px; text-align: center; font-size: 9pt; color: var(--text-muted); }
    @media print { body { background: none; padding: 0; } .document-container { box-shadow: none; padding: 0; max-width: 100%; } }
  </style>
</head>
<body>
  <div class="document-container">
    <header class="header">
      <div class="brand">
        <div class="logo-placeholder">[Logo]</div>
        <div>
          <h1 style="font-size: 18px; color: var(--primary);">[Company Name]</h1>
          <p style="font-size: 10pt; color: var(--text-muted);">Customer Experience & Feedback</p>
        </div>
      </div>
    </header>

    <div class="doc-title-bar">
      <div>
        <h2 class="doc-title">Customer Satisfaction Survey</h2>
      </div>
    </div>

    <div class="section-block">
      <h3>1. Service Quality Assessment</h3>
      <div class="rating-row">
        <span>Overall Quality of Service Received:</span>
        <div class="options">
          <label><input type="radio" name="q1"> Poor</label>
          <label><input type="radio" name="q1"> Fair</label>
          <label><input type="radio" name="q1"> Good</label>
          <label><input type="radio" name="q1"> Excellent</label>
        </div>
      </div>
      <div class="rating-row">
        <span>Timeliness and Punctuality:</span>
        <div class="options">
          <label><input type="radio" name="q2"> Poor</label>
          <label><input type="radio" name="q2"> Fair</label>
          <label><input type="radio" name="q2"> Good</label>
          <label><input type="radio" name="q2"> Excellent</label>
        </div>
      </div>
      <div class="rating-row">
        <span>Communication and Support:</span>
        <div class="options">
          <label><input type="radio" name="q3"> Poor</label>
          <label><input type="radio" name="q3"> Fair</label>
          <label><input type="radio" name="q3"> Good</label>
          <label><input type="radio" name="q3"> Excellent</label>
        </div>
      </div>
    </div>

    <div class="section-block">
      <h3>2. Detailed Comments & Suggestions</h3>
      <textarea placeholder="Please let us know how we can improve our services..."></textarea>
    </div>

    <footer class="footer">
      <p><strong>[Company Name]</strong> | Thank you for helping us improve!</p>
    </footer>
  </div>
</body>
</html>
