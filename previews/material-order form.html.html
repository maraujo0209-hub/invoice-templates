<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Material Order Form</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --gray-light: #f8fafc;
      --gray-border: #e2e8f0;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family); font-size: 11pt; color: var(--text-dark); background-color: #f1f5f9; padding: 20px; }
    .document-container { max-width: 800px; margin: 0 auto; background: #ffffff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid var(--primary); padding-bottom: 20px; margin-bottom: 24px; }
    .brand { display: flex; gap: 16px; align-items: center; }
    .logo-placeholder { width: 70px; height: 70px; background: var(--gray-light); border: 2px dashed var(--accent); display: flex; align-items: center; justify-content: center; font-size: 9pt; color: var(--text-muted); border-radius: 6px; }
    .doc-title-bar { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; }
    .doc-title { font-size: 22px; color: var(--primary); font-weight: 800; text-transform: uppercase; }
    .doc-meta { font-size: 10pt; text-align: right; color: var(--text-muted); line-height: 1.5; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px; }
    .field-group { display: flex; flex-direction: column; font-size: 9.5pt; }
    .field-group label { font-weight: 600; margin-bottom: 4px; color: var(--text-dark); }
    .field-group input { padding: 6px 8px; border: 1px solid var(--gray-border); border-radius: 4px; }
    .table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
    .table th { background-color: var(--primary); color: #ffffff; font-size: 9.5pt; text-align: left; padding: 10px 12px; }
    .table td { padding: 10px 12px; border-bottom: 1px solid var(--gray-border); font-size: 9.5pt; color: var(--text-dark); }
    .table input { width: 100%; padding: 4px; border: 1px solid var(--gray-border); border-radius: 4px; }
    .sig-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 32px; margin-top: 30px; }
    .sig-line { border-top: 1px solid var(--primary); padding-top: 8px; font-size: 9.5pt; color: var(--text-muted); }
    .footer { margin-top: 40px; border-top: 1px solid var(--gray-border); padding-top: 16px; text-align: center; font-size: 9pt; color: var(--text-muted); }
    @media print { body { background: none; padding: 0; } .document-container { box-shadow: none; padding: 0; max-width: 100%; } }
  </style>
</head>
<body>
  <div class="document-container">
    <header class="header">
      <div class="brand">
        <div class="logo-placeholder">[Logo]</div>
        <div>
          <h1 style="font-size: 18px; color: var(--primary);">[Company Name]</h1>
          <p style="font-size: 10pt; color: var(--text-muted);">Site Materials Procurement</p>
        </div>
      </div>
    </header>

    <div class="doc-title-bar">
      <div>
        <h2 class="doc-title">Material Order Form</h2>
      </div>
      <div class="doc-meta">
        <p><strong>Order Date:</strong> [YYYY-MM-DD]</p>
        <p><strong>Required Date:</strong> [YYYY-MM-DD]</p>
      </div>
    </div>

    <div class="grid-2">
      <div class="field-group"><label>Job / Delivery Site:</label><input type="text"></div>
      <div class="field-group"><label>Supplier Name:</label><input type="text"></div>
    </div>

    <table class="table">
      <thead>
        <tr>
          <th>Material Description</th>
          <th style="width: 15%;">Quantity</th>
          <th style="width: 15%;">Unit</th>
          <th style="width: 18%;">Est. Price ($)</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><input type="text" placeholder="Material item name"></td>
          <td><input type="number" placeholder="0"></td>
          <td><input type="text" placeholder="e.g. Boxes, Lbs"></td>
          <td><input type="text" placeholder="$0.00"></td>
        </tr>
        <tr>
          <td><input type="text" placeholder="Material item name"></td>
          <td><input type="number" placeholder="0"></td>
          <td><input type="text" placeholder="e.g. Boxes, Lbs"></td>
          <td><input type="text" placeholder="$0.00"></td>
        </tr>
      </tbody>
    </table>

    <div class="sig-grid">
      <div class="sig-line"><strong>Requisitioner Signature & Date</strong></div>
      <div class="sig-line"><strong>Approved By Signature & Date</strong></div>
    </div>

    <footer class="footer">
      <p><strong>[Company Name]</strong> | Material Requisition Sheet</p>
    </footer>
  </div>
</body>
</html>
